server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: elanor-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Business Configuration (SRS aligned)
elanor:
  shipping:
    free-threshold: ${SHIPPING_FREE_THRESHOLD:1500.00}
    below-threshold-charge: ${SHIPPING_CHARGE:99.00}
    estimated-min-days: ${SHIPPING_MIN_DAYS:3}
    estimated-max-days: ${SHIPPING_MAX_DAYS:7}
  inventory:
    low-stock-threshold: ${LOW_STOCK_THRESHOLD:10}
    reservation-timeout-minutes: ${RESERVATION_TIMEOUT_MINUTES:15}
  returns:
    window-days: ${RETURN_WINDOW_DAYS:7}
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000} # 24 hours
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  shiprocket:
    email: ${SHIPROCKET_EMAIL:}
    password: ${SHIPROCKET_PASSWORD:}
    base-url: ${SHIPROCKET_BASE_URL:https://apiv2.shiprocket.in/v2/console}
    webhook-token: ${SHIPROCKET_WEBHOOK_TOKEN:sr_webhook_secret}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_51a0Hk6b62D7X9}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
