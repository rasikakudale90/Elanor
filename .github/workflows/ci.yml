name: Élanor CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend Test & Build (Spring Boot 3.3.5 / Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Backend Unit/Integration Tests
        working-directory: ./backend
        run: mvn clean test --batch-mode

      - name: Verify Backend Package Creation
        working-directory: ./backend
        run: mvn package -DskipTests --batch-mode

  frontend-ci:
    name: Frontend Lint & Production Build (Next.js 15)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
